# Rebuilds the city prayer-time pages every night (pilot, 2026-10-20).
# Lives in the imuslimlife repo as .github/workflows/city-pages.yml; the source
# of truth is prayer-times-api/apps/web/scripts/city-pages/,
# copied here by scripts/publish-site.sh. Pages only change when the month does,
# so most nights commit nothing. 500 cities x 12 month pages (/prayer-times/<cc>/<city>/<month>/):
# requests are paced (1 per 2.5 s) and budgeted; only new or rolled-over months are fetched
# (~500 calls on the 1st of a month, none on other nights).
name: City prayer-time pages

on:
  schedule:
    - cron: '0 5 * * *' # 01:00 EDT / 00:00 EST, quietest hours for the API
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write # to start the Deploy site workflow (pages.yml)

concurrency:
  group: city-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # a first build is ~6,000 paced requests (~4 h)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate pages
        run: node .github/city-pages/build.mjs --out .
      - name: Commit if anything changed
        id: commit
        run: |
          git add prayer-times ramadan islamic-calendar ar ur id ms fr tr qibla widget masjids sitemap-cities.xml
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "imuslimlife-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "City prayer-time pages: $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A push with the job's own token does not start other workflows, so start the deploy.
      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
