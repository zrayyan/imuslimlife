<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited · Salat-e-Mustaqeem</title>
<meta name="description" content="An invitation to a family circle on Salat-e-Mustaqeem: read the Quran and pray together, with team progress and never rankings.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --ground:#fbf6ec; --card:#fffdf8; --ink:#1d2433; --muted:#6b6f7a; --gold:#c49a4a; --gold-ink:#8a6420; --edge:rgba(196,154,74,.35); }
  @media (prefers-color-scheme: dark) { :root { --ground:#0b1220; --card:#141c2e; --ink:#f3ecdc; --muted:#a8aab4; --gold:#d8b46a; --gold-ink:#e8c983; --edge:rgba(216,180,106,.35); } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--ground); color:var(--ink);
         font-family:Rubik, system-ui, sans-serif;
         background-image:radial-gradient(circle at 50% -10%, rgba(196,154,74,.18), transparent 55%); }
  main { width:100%; max-width:440px; text-align:center; }
  .lantern { width:64px; height:74px; margin:0 auto 18px; filter:drop-shadow(0 0 18px rgba(216,180,106,.55)); }
  .rule { width:36px; height:2px; background:var(--gold); margin:0 auto 14px; }
  h1 { font-family:Amiri, serif; font-weight:700; font-size:34px; line-height:1.15; margin:0 0 10px; }
  p { color:var(--muted); font-size:16px; line-height:1.55; margin:0 0 22px; }
  .card { background:var(--card); border:1px solid var(--edge); border-radius:22px; padding:22px 18px; margin-bottom:18px; }
  .label { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .code { font-family:Amiri, serif; font-size:38px; letter-spacing:.32em; color:var(--gold-ink); padding-left:.32em; direction:ltr; word-break:break-all; }
  .copy { margin-top:12px; background:none; border:1px solid var(--edge); color:var(--ink); border-radius:12px; padding:10px 16px; min-height:44px; font:inherit; cursor:pointer; }
  .steps { text-align:start; color:var(--ink); font-size:15px; line-height:1.6; margin:0; padding-inline-start:20px; }
  .stores { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .store { flex:1 1 180px; display:block; text-decoration:none; background:var(--ink); color:var(--ground); border-radius:16px; padding:14px 16px; min-height:52px; font-weight:500; }
  .fine { font-size:13px; margin-top:22px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <svg class="lantern" viewBox="0 0 26 30" aria-hidden="true">
    <line x1="13" y1="1" x2="13" y2="5" stroke="var(--gold)" stroke-width="1.4"/>
    <path d="M8 6h10l2 4H6z" fill="var(--gold)"/>
    <path d="M6 10h14l-1.5 14h-11z" fill="#f6dc9b" stroke="var(--gold)" stroke-width="1.4"/>
    <path d="M8 24h10l-1 4H9z" fill="var(--gold)"/>
  </svg>
  <div class="rule"></div>
  <h1 id="title">You're invited</h1>
  <p id="lead">A family has invited you to Salat-e-Mustaqeem.</p>

  <div class="card" id="codeCard">
    <div class="label">Your invite code</div>
    <div class="code" id="code">—</div>
    <button class="copy" id="copy" type="button">Copy code</button>
  </div>

  <div class="card">
    <ol class="steps" id="steps">
      <li>Install Salat-e-Mustaqeem (free).</li>
      <li>Open this link again, or enter the code in the app.</li>
    </ol>
  </div>

  <div class="stores">
    <a class="store" href="https://apps.apple.com/app/6743494825">App Store</a>
    <a class="store" href="https://play.google.com/store/apps/details?id=com.rayyan.salatemustaqeem">Google Play</a>
  </div>
  <p class="fine">Already have the app? Opening this link on your phone takes you straight to the invite.</p>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var code = (q.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 32);
    var circle = q.get('type') === 'circle';
    if (!code) { document.getElementById('codeCard').classList.add('hidden'); }
    else { document.getElementById('code').textContent = code; }
    if (circle) {
      document.getElementById('title').textContent = 'Join our family circle';
      document.getElementById('lead').textContent = 'Read the Quran and pray together. Everyone sees the team’s progress, never a ranking.';
      document.getElementById('steps').innerHTML =
        '<li>Install Salat-e-Mustaqeem (free) and sign in.</li>' +
        '<li>Open Journey, tap Circles, then “Join with a code”.</li>' +
        '<li>Enter the code above and your family’s name.</li>';
    }
    document.getElementById('copy').addEventListener('click', function () {
      var b = this;
      try { navigator.clipboard.writeText(code).then(function () { b.textContent = 'Copied'; }); } catch (e) { /* no clipboard */ }
    });
  })();
</script>
</body>
</html>
